# Sirve la PWA y reenvía la API y PowerSync a los contenedores internos.
# Los nombres backend y powersync son los servicios de docker-compose.dokploy.yml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker: nginx arranca aunque el backend todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El build ya trae copias .gz; para el resto se comprime al vuelo.
    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

    client_max_body_size 2m;

    # API de FastAPI
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location = /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # PowerSync (sincronización sin señal): se quita el prefijo /powersync.
    location /powersync/ {
        set $powersync http://powersync:8080;
        rewrite ^/powersync/(.*)$ /$1 break;
        proxy_pass $powersync;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Archivos con hash: se guardan un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker y el HTML siempre se revisan, para que las actualizaciones lleguen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
